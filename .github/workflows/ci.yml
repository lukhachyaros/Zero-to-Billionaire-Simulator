name: CI & Game Data Validation

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate-project:
    name: Validate Schemas, Simulation, C# & Web Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Game Data, Simulation, C# Braces & Web DOM
        run: python tools/validate_game_data.py --check

      - name: Verify Vendored Three.js & Check Web JavaScript Syntax
        run: |
          test -s web/vendor/three.min.js
          node --check web/audio.js
          node --check web/live_leaderboard.js
          node --check web/diorama3d.js
          node --check web/game.js
          node --check web/game_data.js
